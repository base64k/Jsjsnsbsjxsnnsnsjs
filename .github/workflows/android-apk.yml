# Up (PS2) - the Android APK
#
# The port's build, on a GitHub runner: the player's own disc image is fetched
# from their Google Drive file, the game's program is taken out of it and
# decompiled to C++ (the engine's tools), and the result is compiled for
# Android into an APK.
#
# Nothing of the game enters this repository: the disc image is fetched at
# run time and lives in the runner's cache only, and the decompiled code is
# regenerated there too (both caches can be switched off in the inputs).
#
# Kept cheap on purpose: one job, no matrix, the slow stages are skipped when
# the cache has them, a new push cancels the run in flight, and the whole
# thing stops at its timeout.

name: Up (PS2) - Android APK

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages to run: disc extract analyze [derive] lift host [lib] [apk] - 'derive' is the slow, readable tier; 'lib' and 'apk' are for the phone's build (ask for them when you want an APK)"
        default: "disc extract analyze lift host"
        type: string
      abi:
        description: "The ABIs to build (arm64-v8a for phones, x86_64 for the emulator)"
        default: "arm64-v8a"
        type: string
      smoke_rounds:
        description: "The PC reference run's rounds (each one translates the code the run found, then runs again)"
        default: "8"
        type: string
      host_args:
        description: "Extra options for the PC reference run's host (a diagnosis, e.g. --watch 00410C60 --watch-write 0x...)"
        default: ""
        type: string
      cache:
        description: "Keep the disc image and the decompiled code in the runner's cache (they never enter the repository)"
        default: true
        type: boolean
      smoke:
        description: "Also build the PC reference build and run the game headless (how far it boots)"
        default: false
        type: boolean
      publish:
        description: "Publish the APK as a prerelease (the tag: the version in game.json)"
        default: false
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

env:
  # The player's own Drive file: the disc image, read with the link alone.
  UP_DRIVE_FILE_ID: 1LIzZFzNoXUteK5fnJLT1P6vGoIxg1fDA

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # The release step writes to the repository; the rest only reads.
    permissions:
      contents: write
      checks: write
    concurrency:
      group: up-android-apk
      cancel-in-progress: true
    env:
      UP_ABI: ${{ inputs.abi || 'arm64-v8a' }}
      # 'true' unless the run says otherwise: a push has no inputs at all.
      UP_CACHE: ${{ github.event_name == 'push' && 'true' || (inputs.cache && 'true' || 'false') }}
      # The PC reference build and its headless run: on a push it runs too (it
      # is what says how far the game gets), but it can be switched off.
      UP_SMOKE: ${{ github.event_name == 'push' && 'true' || (inputs.smoke && 'true' || 'false') }}
      UP_STAGES: ${{ inputs.stages || 'disc extract analyze lift host' }}
      UP_JOBS: ${{ github.runners.cpu_count || 2 }}
      # The smoke test's rounds: each one translates the code the run found
      # copied at run time and runs the game again.
      UP_SMOKE_ROUNDS: ${{ inputs.smoke_rounds || '8' }}
      UP_SMOKE_SECONDS: '60'
      # The signing key, in the workspace (the cache keeps it, so that a new
      # APK installs over the one the player already has).
      PS2_ANDROID_KEYSTORE: ${{ github.workspace }}/build/keys/ps2port-release.jks
    steps:
      - name: Check out the repository (with the engine)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: The JDK (the APK's dex and its signing)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: The system packages SDL, the tools and the display need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip zip p7zip-full curl ca-certificates ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libxtst-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev xvfb

      - name: The Python packages (the icon, the Drive download)
        run: python -m pip install --disable-pip-version-check pillow gdown

      # The runner's own Android SDK, with the command line tools put in place
      # if it has none. Every word of it goes into the job's summary: the log
      # is not always readable from outside.
      - name: The Android SDK
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          {
            echo "### The Android SDK"
            echo
            echo "ANDROID_HOME=$SDK"
            ls -la "$SDK" || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          SDKMANAGER=""
          for candidate in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "no sdkmanager in the runner's SDK - installing the command line tools" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            mkdir -p "$SDK/cmdline-tools"
            cd /tmp
            for build in 13114758 11076708 9477386; do
              if curl -fsSL -o cmdline-tools.zip \
                   "https://dl.google.com/android/repository/commandlinetools-linux-${build}_latest.zip"; then
                break
              fi
            done
            [ -s cmdline-tools.zip ] || { echo "the command line tools could not be downloaded"; exit 1; }
            unzip -q -o cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "the sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          export ANDROID_HOME="$SDK"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --version 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The NDK, the platform and the build tools
        run: |
          set -o pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | head -1)"
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          # The newest NDK available: its clang honours preserve_none (clang 19
          # and later), which the VU code's calling convention needs.
          NDK_VERSION="$("$SDKMANAGER" --list 2>/dev/null | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^ndk;//' | sort -V | tail -1 || true)"
          if [ -z "$NDK_VERSION" ]; then
            for version in 28.1.13356709 27.2.12479018 27.0.12077973 26.1.10909125; do
              if "$SDKMANAGER" "ndk;$version" > /dev/null 2>&1; then NDK_VERSION="$version"; break; fi
            done
          fi
          [ -n "$NDK_VERSION" ] || { echo "no NDK could be installed"; exit 1; }
          echo "the NDK: $NDK_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! "$SDKMANAGER" "ndk;$NDK_VERSION" > /tmp/ndk.log 2>&1; then
            { echo "the NDK could not be installed:"; tail -30 /tmp/ndk.log; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -3 /tmp/ndk.log | tee -a "$GITHUB_STEP_SUMMARY"
          if ! "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /tmp/sdk.log 2>&1; then
            { echo "the platform and the build tools could not be installed:"; tail -30 /tmp/sdk.log; } \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -3 /tmp/sdk.log | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The compiler for the PC reference build (clang 19 or later)
        if: ${{ env.UP_SMOKE == 'true' }}
        run: |
          if ! clang++ --version 2>/dev/null | grep -qE 'clang version (19|2[0-9])'; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash /tmp/llvm.sh 19
            sudo apt-get install -y --no-install-recommends clang-19
          fi
          (clang++-19 --version 2>/dev/null || clang++ --version) | head -1

      - name: The engine's commit (the caches' key)
        id: engine
        run: echo "sha=$(git -C engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # The disc image: the player's own file, fetched here and never
      # committed. Cached, so that only the first run pays for it.
      # ------------------------------------------------------------------
      - name: The disc image - the cache
        if: ${{ env.UP_CACHE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: disc
          key: disc-v1-${{ env.UP_DRIVE_FILE_ID }}

      - name: The disc image (the player's own Drive file)
        id: fetch
        run: |
          bash scripts/fetch_disc.sh
          IMAGE="${UP_DISC_DIR:-disc}/up.iso"
          if [ -f "$IMAGE" ]; then
            echo "sha=$(sha256sum "$IMAGE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=raw" >> "$GITHUB_OUTPUT"
          fi

      # The image is kept right away: a later stage failing must not throw a
      # gigabyte away.
      - name: The disc image - keep it
        if: ${{ always() && env.UP_CACHE == 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: disc
          key: disc-v1-${{ env.UP_DRIVE_FILE_ID }}

      # ------------------------------------------------------------------
      # The decompiled code: the expensive part (an hour and more). Cached,
      # so that only the first run (and a run after the engine changes) pays
      # for it. It is put in the cache right after it is made, not at the
      # end of the job: a run that fails later must not lose it.
      # ------------------------------------------------------------------
      - name: The decompiled code - the cache
        if: ${{ env.UP_CACHE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            games/up/src
            games/up/config
            games/up/build/functions.json
            games/up/build/verdicts.json
            games/up/build/lift_outcomes.json
            games/up/build/lift
          key: derived-${{ steps.engine.outputs.sha }}-${{ steps.fetch.outputs.sha }}

      # The host's build tools for the Android build (glslang, SDL's sources):
      # a few minutes of compiling, worth keeping.
      - name: The host's build tools - the cache
        if: ${{ env.UP_CACHE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: games/up/build/port/cmake
          key: tools-${{ steps.engine.outputs.sha }}

      # The signing key: the same one every run, so that a new APK installs
      # over the one the player already has.
      - name: The signing key - the cache
        if: ${{ env.UP_CACHE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: build/keys
          key: keystore-v1

      # The code the runs found copied at run time (the overlays do): it is
      # translated, and the game is run again. It is kept under a hash of
      # what it says, so that each new finding is kept and the same one is
      # not kept twice.
      - name: The code found at run time - the cache
        if: ${{ env.UP_CACHE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: games/up/build/port/discovered.txt
          key: discovered-v1-nothing-yet
          restore-keys: |
            discovered-v1-

      # The game's program: the disc's own, the analysis of it, the lifted
      # code and the host's build tools. The APK itself is built after the
      # smoke test, so that it has the code the run found in it.
      - name: The game's program (the disc, the analysis, the lifted code)
        id: stages
        run: |
          STAGES="${UP_STAGES% apk}"
          [ -n "$STAGES" ] || STAGES="disc extract analyze lift host"
          bash scripts/build_apk.sh --stage "$STAGES" --abi "$UP_ABI"
          # Whether the APK's stage was asked for (the check is in the shell:
          # GitHub's expressions have no way to ask whether a word is in a list).
          case " $UP_STAGES " in
            *" apk "*) echo "apk=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "apk=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The code and the tools, kept now: they are the expensive part, and a
      # run that fails later must not make them again.
      - name: The decompiled code - keep it
        if: ${{ always() && env.UP_CACHE == 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            games/up/src
            games/up/config
            games/up/build/functions.json
            games/up/build/verdicts.json
            games/up/build/lift_outcomes.json
            games/up/build/lift
          key: derived-${{ steps.engine.outputs.sha }}-${{ steps.fetch.outputs.sha }}

      - name: The host's build tools - keep it
        if: ${{ always() && env.UP_CACHE == 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: games/up/build/port/cmake
          key: tools-${{ steps.engine.outputs.sha }}

      # The PC reference build: the port's own build of the game, for the
      # runner's processor. It is the slowest part after the translation, so
      # it is kept: a run that only translates the code the last run found
      # takes it from here and builds only what changed.
      - name: The reference build's own hash
        id: reference
        if: ${{ env.UP_SMOKE == 'true' }}
        run: echo "sha=$(bash scripts/reference_hash.sh)" >> "$GITHUB_OUTPUT"

      - name: The PC reference build - the cache
        if: ${{ env.UP_SMOKE == 'true' && env.UP_CACHE == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: games/up/build/linux/up
          key: reference-${{ steps.reference.outputs.sha }}

      # The PC reference build and its headless run: it says how far the game
      # gets, which is the porting work's measure. It fails on its own without
      # stopping the run: the report is worth more than the build.
      - name: The PC reference build and a headless run (how far the game gets)
        if: ${{ env.UP_SMOKE == 'true' }}
        continue-on-error: true
        env:
          UP_HOST_ARGS: ${{ inputs.host_args }}
        run: bash scripts/smoke_test.sh

      - name: The PC reference build - keep it
        if: ${{ always() && env.UP_SMOKE == 'true' && env.UP_CACHE == 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: games/up/build/linux/up
          key: reference-${{ steps.reference.outputs.sha }}

      # The library: the native code, for the phone. The same code means the
      # same library, so a run whose code has not changed takes it from here
      # instead of compiling it again. (Only when the APK was asked for: the
      # library is for the APK, and half an hour of compiling it for nothing
      # is half an hour of the porting work lost.)
      - name: The code's own hash (what the library is made of)
        id: inputs
        if: ${{ steps.stages.outputs.apk == 'true' }}
        run: echo "sha=$(bash scripts/apk_inputs_hash.sh)" >> "$GITHUB_OUTPUT"

      - name: The library from the cache (the code has not changed)
        id: libcache
        if: ${{ steps.stages.outputs.apk == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: games/up/build/port/android-arm64/libup.stripped.so
          key: lib-${{ steps.inputs.outputs.sha }}

      - name: The library (the native code, for the phone)
        if: ${{ steps.stages.outputs.apk == 'true' && steps.libcache.outputs.cache-hit != 'true' }}
        run: bash scripts/build_apk.sh --stage lib --abi "$UP_ABI"

      - name: The library - keep it
        if: ${{ always() && steps.stages.outputs.apk == 'true' && steps.libcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: games/up/build/port/android-arm64/libup.stripped.so
          key: lib-${{ steps.inputs.outputs.sha }}

      # The package's own inputs: the library (the native code), the Java
      # (the dex), the manifest's files. The same inputs mean the same APK,
      # so a run whose package has not changed takes it from here.
      - name: The package's own hash
        id: package
        if: ${{ steps.stages.outputs.apk == 'true' }}
        run: echo "sha=$(bash scripts/apk_package_hash.sh)" >> "$GITHUB_OUTPUT"

      - name: The APK from the cache (nothing that goes into it has changed)
        id: apkc
        if: ${{ steps.stages.outputs.apk == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: build/up-android.apk
          key: apk-${{ steps.package.outputs.sha }}

      # The APK's stage, when it was asked for. (The check is in the shell:
      # GitHub's expressions have no way to ask whether a word is in a list.)
      # What it says is kept in a file: the log of a run is not always
      # readable from outside, but this one is.
      - name: The APK
        if: ${{ steps.stages.outputs.apk == 'true' && steps.apkc.outputs.cache-hit != 'true' }}
        run: |
          set -o pipefail
          mkdir -p build/logs
          case " $UP_STAGES " in
            *" apk "*) bash scripts/build_apk.sh --stage apk --abi "$UP_ABI" 2>&1 | tee build/logs/apk.log ;;
            *) echo "the APK's stage was not asked for: $UP_STAGES" ;;
          esac

      - name: The APK - keep it
        if: ${{ always() && steps.stages.outputs.apk == 'true' && steps.apkc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: build/up-android.apk
          key: apk-${{ steps.package.outputs.sha }}

      - name: The APK
        if: ${{ steps.stages.outputs.apk == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: up-android-${{ inputs.abi || 'arm64-v8a' }}
          path: build/up-android.apk
          if-no-files-found: error
          retention-days: 30

      # The code the runs found: kept under a hash of what it says, so that a
      # later run starts from it (the next round of the porting work).
      - name: The code found at run time - its hash
        id: found
        if: ${{ always() }}
        run: |
          FILE=games/up/build/port/discovered.txt
          if [ -f "$FILE" ]; then
            echo "sha=$(sha256sum "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=none" >> "$GITHUB_OUTPUT"
          fi

      - name: The code found at run time - keep it
        if: ${{ always() && env.UP_CACHE == 'true' && env.UP_SMOKE == 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: games/up/build/port/discovered.txt
          key: discovered-v1-${{ steps.found.outputs.sha }}

      # The sound driver's own code, disassembled: the report names the call
      # that polls, and the code says what it waits for. (The disc's file
      # comes out of the image with 7-Zip; the MIPS disassembler is binutils'.)
      # The sound driver's own code, disassembled: the report names the call
      # that polls, and the code says what it waits for. (The module comes out
      # of the disc image with 7-Zip; the MIPS disassembler is capstone's.)
      - name: The sound driver's code, disassembled (for the poll)
        if: ${{ always() && env.UP_SMOKE == 'true' }}
        continue-on-error: true
        run: |
          mkdir -p build/irx
          python3 -m venv build/irx/venv
          build/irx/venv/bin/pip install -q capstone pyelftools
          7z x -y -obuild/irx disc/up.iso 'MODULES/ZNASND.IRX*' >/dev/null 2>&1 || true
          f="$(find build/irx -iname 'ZNASND.IRX*' -type f | head -1)"
          if [ -n "$f" ]; then
            build/irx/venv/bin/python scripts/disasm_irx.py "$f" 0x10528 0x10740 > build/irx/disasm.txt 2>&1 || true
            build/irx/venv/bin/python scripts/disasm_irx.py "$f" 0x10A00 0x10BC0 >> build/irx/disasm.txt 2>&1 || true
            build/irx/venv/bin/python scripts/disasm_irx.py "$f" 0x10740 0x10800 >> build/irx/disasm.txt 2>&1 || true
            build/irx/venv/bin/python scripts/disasm_irx.py "$f" 0x18F40 0x19040 >> build/irx/disasm.txt 2>&1 || true
            build/irx/venv/bin/python scripts/disasm_irx.py "$f" --find '-0x5108' > build/irx/finds.txt 2>&1 || true
          fi
          {
            echo "module: ${f:-none}"
            echo "lines: $(wc -l < build/irx/disasm.txt 2>/dev/null || echo 0)"
            head -c 1500 build/irx/disasm.txt 2>/dev/null || true
          } > build/irx/diag.txt 2>&1 || true
          cat build/irx/diag.txt || true

      # The game's own report and the pictures it drew: they are how far the
      # port has come, and the log is not always readable from outside.
      - name: The smoke test's report and pictures
        if: ${{ always() && env.UP_SMOKE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: up-smoke
          path: |
            games/up/build/smoke/summary.txt
            games/up/build/smoke/frames
            games/up/build/port/report.txt
          if-no-files-found: ignore
          retention-days: 30

      # The EE's code where the game stopped, disassembled from the analysis
      # (the functions the porting work is about). Only the functions named
      # below are rendered: rendering them all takes minutes.
      - name: The EE's code where the game stopped
        if: ${{ env.UP_SMOKE == 'true' }}
        continue-on-error: true
        run: |
          mkdir -p build
          : > build/ee_disasm.txt
          D="python3 engine/tools/disasm.py --game games/up"
          # The innermost frames of the stop's call stack come first: the
          # fault is in the last of them, not in the functions named here.
          STOP=$(python3 scripts/stop_functions.py games/up/build/smoke/summary.txt 6 || true)
          for a in $STOP 0x004C49A0 0x0041B550 0x00356A60 0x002E05B0 0x0030B9A0 0x0032DE80 0x003078F0; do
            echo "== function $a" >> build/ee_disasm.txt
            $D --addr "$a" >> build/ee_disasm.txt 2>&1 || true
          done

      # The unpacker's last call, run again in Python on the RAM the run left
      # (when --dump-ram asked for the dump): the same bytes, the same
      # arguments. Its answer goes to the end of the report.
      - name: The unpacker's last call, in Python (on the RAM at the stop)
        if: ${{ env.UP_SMOKE == 'true' }}
        continue-on-error: true
        run: |
          if [ -f games/up/build/smoke/ram.bin ] && [ -f games/up/build/port/report.txt ]; then
            python3 scripts/decode_check.py games/up/build/smoke/ram.bin games/up/build/port/report.txt \
              | tee -a games/up/build/port/report.txt
          fi

      # The unpacker's chunk on the disc itself (its header and first control
      # word), so the file it is in and the bytes around it are known.
      - name: The unpacker's chunk on the disc
        if: ${{ env.UP_SMOKE == 'true' }}
        continue-on-error: true
        run: |
          IMAGE="${UP_DISC_DIR:-disc}/up.iso"
          if [ -f "$IMAGE" ] && [ -f games/up/build/port/report.txt ]; then
            python3 scripts/find_chunk.py "$IMAGE" 00000800000002CE A7171050 \
              | tee -a games/up/build/port/report.txt
          fi

      # The same report as a check run on the commit: the artifact and the
      # logs are not always downloadable from outside, the API is.
      - name: The smoke test's report as a check run
        if: ${{ always() && env.UP_SMOKE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_report.py

      # What the build said: the log of the APK's stage (the run's own log is
      # not always readable from outside).
      - name: The build's own words
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: up-build-log
          path: build/logs
          if-no-files-found: ignore
          retention-days: 30

      - name: How far the port has come
        if: always()
        run: |
          if [ -f games/up/build/functions.json ]; then
            python3 engine/tools/progress.py --game games/up --markdown >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: How far the game got
        if: ${{ always() && env.UP_SMOKE == 'true' }}
        run: |
          {
            echo
            echo "### The game's own report"
            echo
            if [ -f games/up/build/smoke/summary.txt ]; then
              cat games/up/build/smoke/summary.txt
            else
              echo "the smoke test did not get to write its report"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>&1

      - name: What the machine looked like
        if: always()
        run: |
          {
            echo
            echo "### The machine"
            echo
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "JAVA_HOME=${JAVA_HOME:-unset}"
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>&1 || true
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" 2>&1 || true
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" 2>&1 || true
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>&1 || true
            df -h . | tail -2
            free -g | head -2
            nproc
          } >> "$GITHUB_STEP_SUMMARY" 2>&1

      - name: Publish the release
        if: ${{ inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("games/up/game.json"))["version"])')"
          TAG="v$VERSION"
          echo "the release: $TAG"
          gh release create "$TAG" build/up-android.apk \
            --title "Up (PS2) - Android $VERSION" \
            --notes "An unofficial native port of Up (PS2, SLUS-21864) to Android. Bring your own disc image: the app asks for it on the first run. Alpha - expect bugs." \
            --prerelease
